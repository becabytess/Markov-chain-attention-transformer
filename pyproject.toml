[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subqtransformer"
version = "1.0.0"
description = "Sub-Quadratic Iterative Transformer with Dynamical Early Stopping & Multi-Scale Graph Routing"
readme = "README.md"
authors = [{ name = "becabytess" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "modal>=0.50.0",
    "tiktoken",
    "requests",
    "tqdm",
]
